[build]
  publish = "site"
  functions = "netlify/functions"
  command = "echo 'Site statique, rien à compiler'"
  # Ne redéploie que si la page ou la fonction ont changé (chaque déploiement coûte des crédits).
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- site netlify netlify.toml"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex"
    Referrer-Policy = "strict-origin-when-cross-origin"
