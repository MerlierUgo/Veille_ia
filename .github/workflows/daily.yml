name: Veille quotidienne

on:
  # Déclencheur principal : la fonction planifiée Netlify « daily-trigger » (4h05 UTC), plus fiable.
  # Les crons GitHub ci-dessous ne servent que de filet de sécurité.
  schedule:
    - cron: "17 4 * * *"
    - cron: "45 5 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Régénérer même si l'édition du jour existe déjà"
        type: boolean
        default: true

permissions:
  contents: write           # nécessaire pour pousser sur la branche data

concurrency:
  group: data-branch        # partagé avec poc.yml : jamais deux écritures en même temps
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Récupérer la branche data
        run: ./.github/scripts/checkout-data.sh

      - name: Vérifier si l'édition du jour existe déjà
        id: check
        run: |
          TODAY=$(date -u +%F)
          FORCE="${{ github.event_name == 'workflow_dispatch' && inputs.force || 'false' }}"
          if [ "$FORCE" != "true" ] && [ -f "out/data/archive/$TODAY.json" ]; then
            echo "Édition du $TODAY déjà publiée : rien à faire."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Génération de l'édition du $TODAY."
          fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Installer les dépendances
        if: steps.check.outputs.skip != 'true'
        run: pip install -r pipeline/requirements.txt

      - name: Lancer le pipeline
        if: steps.check.outputs.skip != 'true'
        env:
          OUT_DIR: ${{ github.workspace }}/out
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
        run: python pipeline/main.py

      - name: Publier
        if: steps.check.outputs.skip != 'true'
        run: ./.github/scripts/push-data.sh "Veille du $(date -u +%F)"
